name: Deploy Vue Site

on:
  push:
    branches:
      - vue-migration
  schedule:
    - cron: '*/22 * * * *' # Runs every 22 minutes
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install -r requirements.txt

    - name: Install Node deps
      run: npm ci

    - name: Run uptime monitor
      run: python3 uptime.py
      env:
        notice_host_server: ${{ secrets.notice_host_server }}
        notice_user: ${{ secrets.notice_user }}
        notice_pwd: ${{ secrets.notice_pwd }}
        notice_mail: ${{ secrets.notice_mail }}
        notice_receiver: ${{ secrets.notice_receiver }}

    - name: Build site
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public

    - name: Commit updated data
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: update uptime data'
        file_pattern: 'data.csv static/sites-data.json'
